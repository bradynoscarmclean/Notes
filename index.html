<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termnotes</title>
<script>
  // Set the theme and text size before first paint so there's no flash
  try {
    const read = k => JSON.parse(window.nativeStore ? window.nativeStore[k] : localStorage.getItem(k));
    if (window.nativeStore) document.documentElement.classList.add('native');
    const t = read('termnotes.theme');
    if (t && t !== 'system') document.documentElement.dataset.theme = t;
    const s = read('termnotes.settings');
    if (s && s.size) document.documentElement.style.setProperty('--size', s.size + 'px');
  } catch {}
</script>
<script src="vendor/marked.min.js"></script>
<style>
  :root {
    --size: 12.5px;
    --fg: #e4e7ec;
    --bold: #ffffff;
    --dim: #8a93a5;
    --yellow: #ecc66c;
    --green: #8fd694;
    --blue: #7cc0ff;
    --link: #4493f8;
    --red: #f28b82;
    --accent: #f78166;
    --rule: rgba(255, 255, 255, 0.13);
    --border: rgba(240, 246, 252, 0.15);
    --subtle: rgba(255, 255, 255, 0.035);
    --card: rgba(13, 17, 23, 0.5);
    --codebg: rgba(110, 118, 129, 0.2);
    --selection: rgba(124, 192, 255, 0.28);
    --tint: rgba(17, 23, 37, 0.55);
    --fallback: linear-gradient(105deg, #191d29 0%, #1e2536 55%, #2a3652 100%);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --fg: #1f2328; --bold: #000000; --dim: #59636e; --yellow: #9a6700; --green: #1a7f37; --blue: #0969da;
      --link: #0969da; --red: #cf222e; --accent: #fd8c73;
      --rule: rgba(0, 0, 0, 0.12); --border: #d1d9e0; --subtle: rgba(246, 248, 250, 0.9);
      --card: rgba(255, 255, 255, 0.82); --codebg: rgba(129, 139, 152, 0.12);
      --selection: rgba(9, 105, 218, 0.18); --tint: rgba(255, 255, 255, 0.5);
      --fallback: linear-gradient(105deg, #f7f8fa 0%, #eef1f6 55%, #e3e9f3 100%);
    }
  }
  :root[data-theme="light"] {
    --fg: #1f2328; --bold: #000000; --dim: #59636e; --yellow: #9a6700; --green: #1a7f37; --blue: #0969da;
    --link: #0969da; --red: #cf222e; --accent: #fd8c73;
    --rule: rgba(0, 0, 0, 0.12); --border: #d1d9e0; --subtle: rgba(246, 248, 250, 0.9);
    --card: rgba(255, 255, 255, 0.82); --codebg: rgba(129, 139, 152, 0.12);
    --selection: rgba(9, 105, 218, 0.18); --tint: rgba(255, 255, 255, 0.5);
    --fallback: linear-gradient(105deg, #f7f8fa 0%, #eef1f6 55%, #e3e9f3 100%);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fallback);
    color: var(--fg);
    font: var(--size)/1.6 "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  /* In the Mac app the window itself is see-through and blurred; the page just adds a tint */
  html.native body { background: var(--tint); padding-top: 28px; }
  b, strong { color: var(--bold); font-weight: 700; }
  .dim { color: var(--dim); }
  button { font: inherit; }

  main { flex: 1; display: flex; gap: 32px; min-height: 0; padding: 12px 24px 0; }

  #sidebar { width: 190px; flex-shrink: 0; display: flex; flex-direction: column; }
  #notesHeader { color: var(--dim); margin-bottom: 8px; }
  #noteList { flex: 1; overflow-y: auto; scrollbar-width: none; }
  #noteList::-webkit-scrollbar { display: none; }
  .note-item { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .note-item::before { content: "  "; white-space: pre; }
  .note-item:hover { color: var(--fg); }
  .note-item.active { color: var(--bold); font-weight: 700; }
  .note-item.active::before { content: "● "; }
  #account { color: var(--dim); padding: 10px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #editorWrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #title {
    background: transparent;
    border: none;
    outline: none;
    padding: 0 0 10px;
    color: var(--yellow);
    font: inherit;
    font-size: calc(var(--size) * 1.55);
    font-weight: 700;
    line-height: 1.3;
  }
  #title::placeholder { color: var(--dim); font-weight: normal; }

  /* README-style card with Write / Preview tabs */
  #card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: stretch;
    gap: 4px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--subtle);
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 10px 6px;
    color: var(--dim);
    cursor: pointer;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--bold); font-weight: 700; border-bottom-color: var(--accent); }
  .card-head .spacer { flex: 1; }
  #wordCount { align-self: center; color: var(--dim); }

  /* The textarea sits on top with invisible text; the backdrop underneath draws the coloured text */
  #editorBox { position: relative; flex: 1; min-height: 0; }
  #backdrop, #editor {
    position: absolute;
    inset: 0;
    margin: 0;
    border: none;
    padding: 16px 20px 24px;
    font: inherit;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-wrap: break-word;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #backdrop::-webkit-scrollbar, #editor::-webkit-scrollbar { display: none; }
  #backdrop { color: var(--fg); pointer-events: none; overflow: hidden; }
  #editor { background: transparent; color: transparent; caret-color: var(--bold); outline: none; resize: none; }
  #editor::selection { background: var(--selection); }
  #editor::placeholder { color: var(--dim); }
  .hl-name, .hl-date { color: var(--green); }
  .hl-term { color: var(--blue); }
  .hl-md { color: var(--bold); }
  .hl-mark { color: var(--dim); }

  #preview { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 20px 32px 32px; }
  #card.preview #editorBox { display: none; }
  #card.preview #preview { display: block; }

  /* GitHub README styling */
  .markdown-body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: calc(var(--size) * 1.2);
    line-height: 1.5;
    color: var(--fg);
    word-wrap: break-word;
  }
  .markdown-body > :first-child { margin-top: 0 !important; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    margin: 24px 0 16px; font-weight: 600; line-height: 1.25; color: var(--bold);
  }
  .markdown-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1em; }
  .markdown-body h5 { font-size: .875em; }
  .markdown-body h6 { font-size: .85em; color: var(--dim); }
  .markdown-body p, .markdown-body blockquote, .markdown-body ul, .markdown-body ol,
  .markdown-body table, .markdown-body pre, .markdown-body .chart { margin: 0 0 16px; }
  .markdown-body a { color: var(--link); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { padding-left: 2em; }
  .markdown-body li + li { margin-top: .25em; }
  .markdown-body li:has(> input[type="checkbox"]) { list-style: none; }
  .markdown-body li > input[type="checkbox"] { margin: 0 .3em .2em -1.4em; vertical-align: middle; }
  .markdown-body blockquote { margin-left: 0; padding: 0 1em; color: var(--dim); border-left: .25em solid var(--border); }
  .markdown-body code {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 85%;
    padding: .2em .4em;
    background: var(--codebg);
    border-radius: 6px;
  }
  .markdown-body pre { padding: 16px; overflow: auto; font-size: 85%; line-height: 1.45; background: var(--codebg); border-radius: 6px; }
  .markdown-body pre code { padding: 0; background: transparent; font-size: 100%; }
  .markdown-body table { border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow: auto; }
  .markdown-body th, .markdown-body td { padding: 6px 13px; border: 1px solid var(--border); }
  .markdown-body th { font-weight: 600; color: var(--bold); }
  .markdown-body tr:nth-child(2n) { background: var(--subtle); }
  .markdown-body img { max-width: 100%; }
  .markdown-body hr { height: .25em; padding: 0; margin: 24px 0; background: var(--border); border: 0; }
  .markdown-body .chart { text-align: center; max-width: 640px; }
  .markdown-body .chart svg { max-width: 100%; height: auto; }
  .markdown-body .hl-term { border-bottom: 1px dotted var(--blue); cursor: help; }
  .markdown-body .empty { color: var(--dim); }

  #defbar { display: none; color: var(--dim); padding: 8px 0 0; }
  #defbar.open { display: block; }
  #defbar .term { color: var(--blue); }

  #panel { display: none; padding: 10px 0 0; max-height: 34vh; overflow-y: auto; scrollbar-width: none; }
  #panel.open { display: block; }
  #panel .heading { margin-top: 10px; }
  #panel .heading:first-child { margin-top: 0; }
  #panel .row { padding-left: 2ch; }
  #panel .term { color: var(--blue); }

  /* Full-page screens (settings, shortcuts) replace the editor while open */
  .screen { display: none; outline: none; overflow-y: auto; }
  #editorWrap.screen-open > :not(.screen.active):not(#prompt) { display: none; }
  .screen.active { display: block; }
  .screen h2 { margin: 0 0 4px; font-size: calc(var(--size) * 1.55); line-height: 1.3; color: var(--yellow); }
  .screen .hint { color: var(--dim); margin-bottom: 14px; }
  .setting { cursor: pointer; padding: 1px 0; color: var(--fg); white-space: pre-wrap; }
  .setting::before { content: "  "; }
  .setting.sel { color: var(--bold); font-weight: 700; }
  .setting.sel::before { content: "❯ "; }
  .setting .val { color: var(--blue); }
  .setting .note { color: var(--dim); font-weight: normal; }
  .keyrow { display: flex; gap: 16px; }
  .keyrow b { min-width: 6ch; }
  .screen h3 { margin: 18px 0 6px; font-size: 1em; color: var(--bold); }

  #prompt {
    display: none;
    margin-top: 10px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
    align-items: center;
  }
  #prompt.open { display: flex; }
  #promptLabel { color: var(--dim); white-space: pre; }
  #promptInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    color: var(--fg);
    font: inherit;
    caret-color: var(--bold);
  }

  footer { padding: 10px 24px 12px; color: var(--dim); }
  footer > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.ok { color: var(--fg); }
  #status.err { color: var(--red); }
  #keys { margin-top: 2px; }

  @media (max-width: 640px) {
    main { gap: 16px; padding: 12px 16px 0; }
    footer { padding: 10px 16px 12px; }
    #sidebar { width: 110px; }
    #preview { padding: 16px; }
  }
</style>
</head>
<body>
<main>
  <nav id="sidebar">
    <div id="notesHeader"></div>
    <div id="noteList"></div>
    <div id="account"></div>
  </nav>
  <section id="editorWrap">
    <input id="title" placeholder="Untitled" spellcheck="false">
    <div id="settings" class="screen" tabindex="0"></div>
    <div id="help" class="screen" tabindex="0"></div>
    <div id="card">
      <div class="card-head">
        <button class="tab" data-mode="write">Write</button>
        <button class="tab" data-mode="preview">Preview</button>
        <span class="spacer"></span>
        <span id="wordCount"></span>
      </div>
      <div id="editorBox">
        <div id="backdrop" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" placeholder="Start typing... # for a heading, - for a list. Paste or drag in images."></textarea>
      </div>
      <article id="preview" class="markdown-body"></article>
    </div>
    <div id="defbar"></div>
    <div id="panel"></div>
    <div id="prompt"><span id="promptLabel"></span><input id="promptInput" spellcheck="false" autocomplete="off"></div>
  </section>
</main>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<footer>
  <div id="status"></div>
  <div id="keys"><b>⌘E</b> preview · <b>⌘/</b> all shortcuts · <b>⌘,</b> settings · <b>⌘T</b> table · <b>⌘⇧C</b> chart · <b>⌘⇧I</b> image · <b>⌘D</b> define · <b>⌘S</b> shorthand · <b>Tab</b> expand</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const editor = $('editor'), titleEl = $('title'), backdrop = $('backdrop');

// ---- storage: the Mac app provides window.nativeStore and saves to disk; browsers fall back to localStorage ----
const nativeSave = window.webkit?.messageHandlers?.store;
function load(key, fallback) {
  try {
    const raw = window.nativeStore ? window.nativeStore[key] : localStorage.getItem(key);
    return JSON.parse(raw) ?? fallback;
  } catch { return fallback; }
}
function save(key, val) {
  const raw = JSON.stringify(val);
  try {
    if (nativeSave) { window.nativeStore[key] = raw; nativeSave.postMessage({ key, value: raw }); }
    else localStorage.setItem(key, raw);
  } catch {}
}

let notes = load('termnotes.notes', []);
let shorthands = load('termnotes.shorthands', {});
let dictionary = load('termnotes.dictionary', {}); // lowercased term -> { term, def }
let github = load('termnotes.github', {});
let currentId = load('termnotes.current', null);
let settings = {
  autoExpand: false, names: true, dates: true, terms: true, size: 12.5, showKeys: true, mode: 'write',
  ...load('termnotes.settings', {}),
};

if (!notes.length) newNote(false);
if (!notes.find(n => n.id === currentId)) currentId = notes[0].id;

function current() { return notes.find(n => n.id === currentId); }
function persist() { save('termnotes.notes', notes); save('termnotes.current', currentId); }

// ---- notes ----
function newNote(focus = true) {
  const n = { id: Date.now().toString(36), title: '', body: '', updated: Date.now() };
  notes.unshift(n);
  currentId = n.id;
  persist();
  if (focus) { setMode('write'); render(); titleEl.focus(); }
}

function deleteNote() {
  const n = current();
  if (!confirm(`Delete "${n.title || 'Untitled'}"?`)) return;
  notes = notes.filter(x => x.id !== n.id);
  if (!notes.length) newNote(false);
  currentId = notes[0].id;
  persist();
  render();
  status('Note deleted', 'ok');
}

function render() {
  const n = current();
  titleEl.value = n.title;
  editor.value = n.body;
  $('notesHeader').innerHTML = `Listed <b>${notes.length}</b> note${notes.length === 1 ? '' : 's'}`;
  const list = $('noteList');
  list.innerHTML = '';
  for (const note of notes) {
    const div = document.createElement('div');
    div.className = 'note-item' + (note.id === currentId ? ' active' : '');
    div.textContent = note.title || 'Untitled';
    div.onclick = () => { currentId = note.id; persist(); render(); if (settings.mode === 'write') editor.focus(); };
    list.appendChild(div);
  }
  renderPanel();
  renderHighlights();
  updateDefbar();
  updateWordCount();
  if (settings.mode === 'preview') renderPreview();
}

function updateWordCount() {
  const words = (editor.value.match(/[A-Za-z0-9'’-]+/g) || []).length;
  $('wordCount').textContent = `${words} word${words === 1 ? '' : 's'}`;
}

function savedStatus() {
  status(`Saved · ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`, '', 0);
}

titleEl.addEventListener('input', () => {
  const n = current();
  n.title = titleEl.value; n.updated = Date.now();
  persist();
  render();
  savedStatus();
});
titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); setMode('write'); }
});
editor.addEventListener('input', () => {
  const n = current();
  n.body = editor.value; n.updated = Date.now();
  persist();
  renderHighlights();
  updateDefbar();
  updateWordCount();
  savedStatus();
});
editor.addEventListener('scroll', () => { backdrop.scrollTop = editor.scrollTop; });
document.addEventListener('selectionchange', () => { if (document.activeElement === editor) updateDefbar(); });

// ---- Write / Preview (Cmd+E) ----
function setMode(mode) {
  settings.mode = mode;
  save('termnotes.settings', settings);
  $('card').classList.toggle('preview', mode === 'preview');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  if (mode === 'preview') renderPreview();
  else editor.focus();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
$('preview').addEventListener('dblclick', () => setMode('write'));

// ---- README-style preview: markdown, images, charts ----
const nativeImages = window.webkit?.messageHandlers?.images;

function renderPreview() {
  const box = $('preview');
  const md = editor.value.trim();
  box.innerHTML = md
    ? marked.parse(editor.value, { gfm: true })
    : '<p class="empty">Nothing here yet. Press ⌘E to start writing.</p>';
  // Local images are stored by the Mac app and served through the tnimg: scheme
  box.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (nativeImages && src.startsWith('images/')) img.src = 'tnimg://local/' + encodeURIComponent(src.slice(7));
  });
  box.querySelectorAll('a').forEach(a => { a.target = '_blank'; });
  highlightTextNodes(box);
  const charts = box.querySelectorAll('pre > code.language-mermaid');
  if (charts.length) renderCharts(charts);
}

let mermaidLoading;
function loadMermaid() {
  return mermaidLoading ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'vendor/mermaid.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('chart library failed to load'));
    document.head.appendChild(s);
  });
}

// ```mermaid code blocks become charts, the same way GitHub renders them
async function renderCharts(blocks) {
  const nodes = [...blocks].map(code => {
    const div = document.createElement('div');
    div.className = 'chart';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
    return div;
  });
  try {
    await loadMermaid();
    // Charts use the app's colours on a transparent background instead of mermaid's grey box
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const fg = css('--fg'), dim = css('--dim');
    const palette = isDark()
      ? ['#4493f8', '#8fd694', '#ecc66c', '#f78166', '#bc8cff', '#56d4dd']
      : ['#0969da', '#1a7f37', '#bf8700', '#cf222e', '#8250df', '#1b7c83'];
    const pie = Object.fromEntries(palette.map((c, i) => [`pie${i + 1}`, c]));
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: 'base',
      themeVariables: {
        darkMode: isDark(),
        background: 'transparent',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif',
        primaryColor: isDark() ? '#1c2b45' : '#ddf4ff',
        primaryBorderColor: palette[0],
        primaryTextColor: fg,
        textColor: fg,
        lineColor: dim,
        ...pie,
        pieStrokeColor: 'transparent',
        pieOuterStrokeColor: 'transparent',
        pieTitleTextColor: fg,
        pieLegendTextColor: fg,
        pieSectionTextColor: '#ffffff',
        xyChart: {
          backgroundColor: 'transparent',
          titleColor: fg,
          xAxisLabelColor: dim, yAxisLabelColor: dim,
          xAxisTitleColor: fg, yAxisTitleColor: fg,
          xAxisLineColor: dim, yAxisLineColor: dim,
          xAxisTickColor: dim, yAxisTickColor: dim,
          plotColorPalette: palette.join(', '),
        },
      },
    });
    await mermaid.run({ nodes, suppressErrors: true });
  } catch (err) {
    status(`Chart error: ${err.message}`, 'err');
  }
}

function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

// Colours names/dates/dictionary words in the preview, leaving code, links and headings alone
function highlightTextNodes(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('code, pre, a, .chart, h1, h2, h3, h4, h5, h6')
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  for (const node of textNodes) {
    const text = node.data;
    const ranges = findRanges(text);
    if (!ranges.length) continue;
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const r of ranges) {
      frag.append(text.slice(pos, r.start));
      const span = document.createElement('span');
      span.className = r.cls;
      span.textContent = text.slice(r.start, r.end);
      if (r.cls === 'hl-term') span.title = dictionary[span.textContent.toLowerCase()]?.def || '';
      frag.append(span);
      pos = r.end;
    }
    frag.append(text.slice(pos));
    node.replaceWith(frag);
  }
}

// ---- highlighting: dictionary terms blue, dates, times and names green ----
const MONTH = '(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const DAY = '\\d{1,2}(?:st|nd|rd|th)?';
const DATE_RE = new RegExp([
  '\\d{4}-\\d{1,2}-\\d{1,2}',
  '\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?',
  // Dashes and dots need a year, so "5-6 people" and "1.5" aren't dates
  '\\d{1,2}([.-])\\d{1,2}\\1\\d{2,4}',
  `${MONTH}\\.?\\s+${DAY}(?:,?\\s+\\d{4})?`,
  `${DAY}\\s+(?:of\\s+)?${MONTH}(?:,?\\s+\\d{4})?`,
  `${MONTH}\\s+\\d{4}`,
  // "May" and "March" on their own are too often ordinary words
  '(?:january|february|april|june|july|august|september|october|november|december)',
  '(?:(?:next|last|this)\\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)day',
  '(?:today|tonight|tomorrow|yesterday)',
  '\\d{1,2}(?::\\d{2})?\\s?[ap]\\.?m\\.?',
  '\\d{1,2}:\\d{2}',
].map(p => `\\b${p}(?![\\w])`).join('|'), 'gi');
const NAME_RE = /\b[A-Z][a-z]+(?:[ \t]+[A-Z][a-z]+)*\b/g;
// Text ending here means the next word starts a sentence, list item ("- ", "1. ", "- [ ] "), quote, heading or table cell
const SENTENCE_START_RE = /(?:^|[.!?:|\n])\s*(?:(?:[-*+>]|\d+[.)]|#{1,6})\s+)?(?:\[[ xX]\]\s*)?$/;
// Markdown in the Write tab: headings bright, image/link syntax and fences dimmed
const MD_HEADING_RE = /^#{1,6}[ \t].*$/gm;
const MD_MARK_RE = /!?\[[^\]\n]*\]\([^)\n]*\)|^```.*$/gm;

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function dictionaryRegex() {
  const terms = Object.values(dictionary).map(d => d.term).sort((a, b) => b.length - a.length);
  if (!terms.length) return null;
  const parts = terms.map(t => (/^\w/.test(t) ? '\\b' : '') + escapeRegex(t) + (/\w$/.test(t) ? '\\b' : ''));
  return new RegExp(parts.join('|'), 'gi');
}

function findRanges(text, markdown = false) {
  const ranges = [];
  const free = (s, e) => !ranges.some(r => s < r.end && e > r.start);
  const add = (re, cls) => {
    if (!re) return;
    for (const m of text.matchAll(re)) {
      let start = m.index;
      const end = start + m[0].length;
      if (cls === 'hl-name' && SENTENCE_START_RE.test(text.slice(0, start))) {
        // The first word of a sentence, list item or table cell is capitalised anyway, so it isn't treated as a name
        const gap = m[0].search(/\s/);
        if (gap < 0) continue;
        start += m[0].slice(gap).search(/\S/) + gap;
      }
      if (start < end && free(start, end)) ranges.push({ start, end, cls });
    }
  };
  if (markdown) { add(MD_HEADING_RE, 'hl-md'); add(MD_MARK_RE, 'hl-mark'); }
  if (settings.terms) add(dictionaryRegex(), 'hl-term');
  if (settings.dates) add(DATE_RE, 'hl-date');
  if (settings.names) add(NAME_RE, 'hl-name');
  return ranges.sort((a, b) => a.start - b.start);
}

function renderHighlights() {
  const text = editor.value;
  let html = '', pos = 0;
  for (const r of findRanges(text, true)) {
    html += escapeHtml(text.slice(pos, r.start)) + `<span class="${r.cls}">${escapeHtml(text.slice(r.start, r.end))}</span>`;
    pos = r.end;
  }
  // Trailing newline + space keeps the backdrop's height matching the textarea's
  backdrop.innerHTML = html + escapeHtml(text.slice(pos)) + '\n ';
  backdrop.scrollTop = editor.scrollTop;
}

// Shows the definition when the cursor is on a dictionary word
function updateDefbar() {
  const bar = $('defbar');
  const re = dictionaryRegex();
  const pos = editor.selectionStart;
  let hit = null;
  if (re && settings.mode === 'write') for (const m of editor.value.matchAll(re)) {
    if (pos >= m.index && pos <= m.index + m[0].length) { hit = dictionary[m[0].toLowerCase()]; break; }
  }
  bar.classList.toggle('open', !!hit);
  if (hit) bar.innerHTML = `⎿  <span class="term">${escapeHtml(hit.term)}</span>: ${escapeHtml(hit.def)}`;
}

// ---- inserting tables, charts and images ----
// Inserts at the cursor; `block` makes sure it starts on its own paragraph, as markdown tables need
function insertText(text, block = false) {
  if (settings.mode !== 'write') setMode('write');
  editor.focus();
  const pos = editor.selectionStart;
  const before = editor.value.slice(0, pos);
  const lead = before === '' || before.endsWith('\n\n') ? ''
    : before.endsWith('\n') ? (block ? '\n' : '') : (block ? '\n\n' : '\n');
  editor.setRangeText(lead + text, pos, editor.selectionEnd, 'end');
  editor.dispatchEvent(new Event('input'));
}

async function insertTable() {
  const size = await ask('Table size, columns x rows:', { value: '3x3' });
  if (!size) return;
  const m = size.match(/^(\d+)\s*[x×*, ]\s*(\d+)$/i);
  if (!m) { status('Type the size like 3x4', 'err'); return; }
  const cols = Math.min(Math.max(+m[1], 1), 12), rows = Math.min(Math.max(+m[2], 1), 50);
  const header = '| ' + Array.from({ length: cols }, (_, i) => `Column ${i + 1}`).join(' | ') + ' |';
  const lines = [header, '|' + ' --- |'.repeat(cols), ...Array(rows).fill('|' + '   |'.repeat(cols))];
  insertText(lines.join('\n') + '\n\n', true);
  status('Table added. Fill it in, then ⌘E to see it', 'ok');
}

const CHARTS = {
  bar: 'xychart-beta\n    title "Hours studied"\n    x-axis [Mon, Tue, Wed, Thu, Fri]\n    y-axis "Hours" 0 --> 5\n    bar [1, 2.5, 2, 4, 3]',
  line: 'xychart-beta\n    title "Test scores"\n    x-axis [Test 1, Test 2, Test 3, Test 4]\n    y-axis "Score" 0 --> 100\n    line [62, 70, 78, 91]',
  pie: 'pie title Where my time goes\n    "School" : 35\n    "Sleep" : 35\n    "Friends" : 20\n    "Other" : 10',
  flow: 'flowchart LR\n    A[Start] --> B{Done homework?}\n    B -->|Yes| C[Free time]\n    B -->|No| D[Do homework]\n    D --> B',
};

async function insertChart() {
  const type = (await ask('Chart type (bar, line, pie, flow):', { value: 'bar' }))?.toLowerCase();
  if (!type) return;
  if (!CHARTS[type]) { status('Chart type must be bar, line, pie or flow', 'err'); return; }
  insertText('```mermaid\n' + CHARTS[type] + '\n```\n\n', true);
  status('Chart added. Change the labels and numbers, then ⌘E to see it', 'ok');
}

async function insertImageFile(file) {
  if (!file.type.startsWith('image/')) return;
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  let src = dataUrl;
  if (nativeImages) {
    // The Mac app saves the image next to your notes; pushing to GitHub uploads it to the repo's images/ folder
    const ext = (file.type.split('/')[1] || 'png').replace('jpeg', 'jpg').replace('svg+xml', 'svg').replace(/[^a-z0-9]/g, '');
    const name = `img-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}.${ext}`;
    await nativeImages.postMessage({ action: 'save', name, data: dataUrl.split(',')[1] });
    src = `images/${name}`;
  }
  const alt = (file.name || 'image').replace(/\.[^.]+$/, '').replace(/[[\]]/g, '');
  insertText(`![${alt}](${src})\n`);
  status('Image added. ⌘E to see it', 'ok');
}

const imageFiles = list => [...(list || [])].filter(f => f.type.startsWith('image/'));
editor.addEventListener('paste', e => {
  const files = imageFiles(e.clipboardData?.files);
  if (!files.length) return;
  e.preventDefault();
  files.forEach(insertImageFile);
});
// Stop dropped files from opening in place of the app
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  imageFiles(e.dataTransfer?.files).forEach(insertImageFile);
});
$('filePick').addEventListener('change', e => {
  imageFiles(e.target.files).forEach(insertImageFile);
  e.target.value = '';
});

// ---- shorthand expansion: on Tab, or automatically after a space/punctuation if that setting is on ----
// Replaces a two-letter shorthand ending at `end`; returns the length change, or null if there was none
function expandAt(end) {
  const m = editor.value.slice(0, end).match(/(?:^|[^A-Za-z])([A-Za-z]{2})$/);
  const abbr = m && m[1];
  const full = abbr && shorthands[abbr.toLowerCase()];
  if (!full) return null;
  // Keep capitalisation if the shorthand was typed with a capital first letter
  const word = abbr[0] === abbr[0].toUpperCase() ? full[0].toUpperCase() + full.slice(1) : full;
  editor.setRangeText(word, end - 2, end, 'preserve');
  return word.length - 2;
}

editor.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.altKey || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const pos = editor.selectionStart;
  const grew = expandAt(pos);
  if (grew === null) editor.setRangeText('  ', pos, editor.selectionEnd, 'end');
  else editor.setSelectionRange(pos + grew, pos + grew);
  editor.dispatchEvent(new Event('input'));
});

editor.addEventListener('input', e => {
  if (!settings.autoExpand) return;
  const typedBreak = e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph'
    || (e.inputType === 'insertText' && /^[^A-Za-z0-9'-]$/.test(e.data));
  if (!typedBreak) return;
  const pos = editor.selectionStart;
  const grew = expandAt(pos - 1);
  if (grew === null) return;
  editor.setSelectionRange(pos + grew, pos + grew);
  editor.dispatchEvent(new Event('input'));
});

// ---- bottom prompt: ask(label) resolves with the typed text, or null on Esc ----
const promptEl = $('prompt'), promptInput = $('promptInput'), promptLabel = $('promptLabel');
let promptResolve = null, returnFocus = null;

function ask(label, { value = '', maxLength, secret = false } = {}) {
  if (!promptResolve) returnFocus = document.activeElement;
  promptLabel.textContent = `❯ ${label} `;
  promptInput.value = value;
  promptInput.type = secret ? 'password' : 'text';
  if (maxLength) promptInput.maxLength = maxLength; else promptInput.removeAttribute('maxlength');
  promptEl.classList.add('open');
  promptInput.focus();
  promptInput.select();
  return new Promise(resolve => { promptResolve = resolve; });
}
function finishPrompt(result) {
  const resolve = promptResolve;
  promptResolve = null;
  promptEl.classList.remove('open');
  (returnFocus || editor).focus();
  resolve(result);
}
promptInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); finishPrompt(null); status('Cancelled'); }
  else if (e.key === 'Enter') { e.preventDefault(); finishPrompt(promptInput.value.trim()); }
});

// ---- dictionary (Cmd+D) ----
function selectedTerm() {
  let { selectionStart: s, selectionEnd: e, value } = editor;
  if (s === e) {
    // Nothing selected: use the word the cursor is in
    while (s > 0 && /[\w'-]/.test(value[s - 1])) s--;
    while (e < value.length && /[\w'-]/.test(value[e])) e++;
  }
  return value.slice(s, e).trim().replace(/\s+/g, ' ');
}

async function defineTerm() {
  if (settings.mode !== 'write') { status('Switch to Write (⌘E) and select a word first', 'err'); return; }
  const term = selectedTerm();
  if (!term) { status('Select a word first', 'err'); return; }
  if (term.length > 60) { status('Selection is too long to define', 'err'); return; }
  const key = term.toLowerCase();
  const existing = dictionary[key];
  const def = await ask(`Define "${term}" (blank = remove):`, { value: existing ? existing.def : '' });
  if (def === null) return;
  if (def) {
    dictionary[key] = { term: existing ? existing.term : term, def };
    status(`Defined "${term}"`, 'ok');
  } else if (existing) {
    delete dictionary[key];
    status(`Removed "${term}"`, 'ok');
  } else {
    return;
  }
  save('termnotes.dictionary', dictionary);
  renderPanel();
  renderHighlights();
  updateDefbar();
}

// ---- shorthand (Cmd+S, and Cmd+Shift+S for the selected word) ----
async function askAbbr(label) {
  while (true) {
    const abbr = await ask(label, { maxLength: 2 });
    if (abbr === null) return null;
    if (/^[A-Za-z]{2}$/.test(abbr)) return abbr.toLowerCase();
    status('Shorthand must be exactly 2 letters', 'err');
  }
}

async function shorthandForSelection() {
  const word = settings.mode === 'write' ? selectedTerm() : '';
  if (!word) { status('Select a word first', 'err'); return; }
  const abbr = await askAbbr(`Shorthand for "${word}" (2 letters):`);
  if (abbr === null) return;
  const replaced = shorthands[abbr];
  shorthands[abbr] = word;
  save('termnotes.shorthands', shorthands);
  renderPanel();
  status(`Added ${abbr} → ${word}${replaced && replaced !== word ? ` (replaced ${replaced})` : ''}`, 'ok');
}

async function addShorthand() {
  const abbr = await askAbbr('Shorthand (2 letters):');
  if (abbr === null) return;
  const existing = shorthands[abbr];
  const full = await ask(`"${abbr}" expands to (blank = remove):`, { value: existing || '' });
  if (full === null) return;
  if (full) {
    shorthands[abbr] = full;
    status(`Added ${abbr} → ${full}`, 'ok');
  } else if (existing) {
    delete shorthands[abbr];
    status(`Removed ${abbr}`, 'ok');
  } else {
    status('Nothing to remove');
  }
  save('termnotes.shorthands', shorthands);
  renderPanel();
}

function renderPanel() {
  const box = $('panel');
  box.innerHTML = '';
  const section = (title, entries, emptyMsg, keyClass) => {
    box.insertAdjacentHTML('beforeend', `<div class="heading"><b>${title}</b></div>`);
    if (!entries.length) box.insertAdjacentHTML('beforeend', `<div class="row dim">${emptyMsg}</div>`);
    for (const [k, v] of entries) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="${keyClass}"></span> <span class="dim">→</span> <span></span>`;
      row.children[0].textContent = k;
      row.children[2].textContent = v;
      box.appendChild(row);
    }
  };
  section('Shorthands', Object.keys(shorthands).sort().map(k => [k, shorthands[k]]),
    'None yet. Press ⌘S to add one.', '');
  section('Dictionary', Object.values(dictionary).sort((a, b) => a.term.localeCompare(b.term)).map(d => [d.term, d.def]),
    'None yet. Select a word and press ⌘D.', 'term');
}

// ---- theme: 'system', 'dark' or 'light' (Cmd+Shift+L flips light/dark) ----
function setTheme(mode) {
  if (mode === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  save('termnotes.theme', mode);
  window.webkit?.messageHandlers?.theme?.postMessage(mode);
  // Charts are drawn with theme colours, so redraw them
  if (settings.mode === 'preview') renderPreview();
}

function toggleTheme() {
  const dark = isDark();
  setTheme(dark ? 'light' : 'dark');
  status(dark ? 'Light mode' : 'Dark mode', 'ok');
  if (screenOpen() === 'settings') renderSettings();
}

// ---- full-page screens: settings (Cmd+,) and shortcuts (Cmd+/) ----
function screenOpen() {
  return document.querySelector('.screen.active')?.id || null;
}
function openScreen(id) {
  if (promptResolve) return;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $('editorWrap').classList.add('screen-open');
  if (id === 'settings') renderSettings(); else renderHelp();
  $(id).focus();
}
function closeScreen() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('editorWrap').classList.remove('screen-open');
  if (settings.mode === 'write') editor.focus();
}
const openSettings = () => openScreen('settings');
window.openSettings = openSettings;

const capitalise = s => s[0].toUpperCase() + s.slice(1);
const SETTINGS = [
  { key: 'autoExpand', label: 'Expand shorthands without pressing Tab', note: 'after a space, punctuation or new line' },
  { key: 'names', label: 'Highlight names' },
  { key: 'dates', label: 'Highlight dates and times' },
  { key: 'terms', label: 'Highlight dictionary words' },
  { key: 'size', label: 'Text size', options: [11, 12, 12.5, 13, 13.5, 14, 15, 16], format: v => `${v}px` },
  { key: 'theme', label: 'Theme', options: ['system', 'dark', 'light'], format: capitalise },
  { key: 'showKeys', label: 'Show shortcuts at the bottom' },
];
let settingIndex = 0;

const settingValue = s => s.key === 'theme' ? load('termnotes.theme', 'system') : settings[s.key];

function applySettings() {
  document.documentElement.style.setProperty('--size', settings.size + 'px');
  $('keys').style.display = settings.showKeys ? '' : 'none';
  renderHighlights();
  updateDefbar();
}

function changeSetting(s, step = 1) {
  if (s.options) {
    const i = s.options.indexOf(settingValue(s));
    const next = s.options[(i + step + s.options.length) % s.options.length];
    if (s.key === 'theme') setTheme(next);
    else settings[s.key] = next;
  } else {
    settings[s.key] = !settings[s.key];
  }
  save('termnotes.settings', settings);
  applySettings();
  renderSettings();
}

function renderSettings() {
  const box = $('settings');
  box.innerHTML = '<h2>Settings</h2><div class="hint">↑↓ to move · Space or ←→ to change · Esc to close</div>';
  SETTINGS.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'setting' + (i === settingIndex ? ' sel' : '');
    const value = settingValue(s);
    const shown = s.options ? `‹ ${s.format(value)} ›` : value ? '[x]' : '[ ]';
    row.innerHTML = s.options
      ? `${escapeHtml(s.label)}  <span class="val">${escapeHtml(shown)}</span>`
      : `<span class="val">${shown}</span> ${escapeHtml(s.label)}${s.note ? `  <span class="note">${escapeHtml(s.note)}</span>` : ''}`;
    row.onclick = () => { settingIndex = i; changeSetting(s); };
    box.appendChild(row);
  });
}

$('settings').addEventListener('keydown', e => {
  const s = SETTINGS[settingIndex];
  const keys = {
    ArrowUp: () => { settingIndex = (settingIndex + SETTINGS.length - 1) % SETTINGS.length; renderSettings(); },
    ArrowDown: () => { settingIndex = (settingIndex + 1) % SETTINGS.length; renderSettings(); },
    ArrowLeft: () => changeSetting(s, -1),
    ArrowRight: () => changeSetting(s, 1),
    ' ': () => changeSetting(s, 1),
    Enter: () => changeSetting(s, 1),
    Escape: closeScreen,
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});

// ---- GitHub account (Cmd+G) ----
const nativeGithub = window.webkit?.messageHandlers?.github;
const ghHeaders = token => ({ Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' });

function renderAccount() {
  const el = $('account');
  if (github.login) el.innerHTML = `GitHub <b></b>`, el.querySelector('b').textContent = '@' + github.login;
  else el.innerHTML = 'GitHub off · <b>⌘G</b>';
}

async function connectGithub() {
  if (github.token) {
    if (!confirm(`Disconnect GitHub account @${github.login || 'unknown'}?`)) return;
    github = { repo: github.repo };
    save('termnotes.github', github);
    renderAccount();
    status('GitHub disconnected', 'ok');
    return;
  }
  if (nativeGithub && window.hasGitHubApp) {
    // The Mac app runs GitHub's sign-in and calls window.githubLogin with the progress
    status('Opening GitHub sign-in...');
    nativeGithub.postMessage({ action: 'login' });
    return;
  }
  const token = await ask('GitHub token:', { secret: true });
  if (token) finishConnect(token);
}

async function finishConnect(token) {
  try {
    const res = await fetch('https://api.github.com/user', { headers: ghHeaders(token) });
    if (!res.ok) throw new Error(res.status === 401 ? 'GitHub rejected the sign-in' : res.statusText);
    github.token = token;
    github.login = (await res.json()).login;
    save('termnotes.github', github);
    renderAccount();
    status(`Connected to GitHub as @${github.login}`, 'ok');
  } catch (err) {
    status(`GitHub connect failed: ${err.message}`, 'err');
  }
}

window.githubLogin = msg => {
  if (msg.code) status(`In your browser, enter code ${msg.code} (already copied)`, 'ok', 0);
  else if (msg.token) finishConnect(msg.token);
  else if (msg.error) status(`GitHub sign-in failed: ${msg.error}`, 'err');
};

// ---- GitHub push (Cmd+P): images go to images/, the note to README.md ----
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function putFile(repo, path, base64, message) {
  const url = `https://api.github.com/repos/${repo}/contents/${path}`;
  const headers = ghHeaders(github.token);
  // Updating an existing file requires its current sha
  let sha;
  const existing = await fetch(url, { headers });
  if (existing.ok) sha = (await existing.json()).sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers,
    body: JSON.stringify({ message, content: base64, ...(sha && { sha }) }),
  });
  if (!res.ok) {
    if (res.status === 401) throw new Error('GitHub connection expired, press ⌘G to reconnect');
    if (res.status === 404) throw new Error(`your account can't write to ${repo}`);
    throw new Error((await res.json()).message || res.statusText);
  }
}

async function pushNote() {
  const n = current();
  if (!github.token) { status('Connect your GitHub account first (⌘G)', 'err'); return; }

  let repo = await ask('Push README.md to repo:', { value: n.repo || github.repo || '' });
  if (!repo) return;
  if (!repo.includes('/') && github.login) repo = `${github.login}/${repo}`;
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { status('Repo must look like name or owner/name', 'err'); return; }
  n.repo = github.repo = repo;
  persist();
  save('termnotes.github', github);

  const [owner, name] = repo.split('/');
  const headers = ghHeaders(github.token);
  status(`Pushing to ${repo}...`, '', 0);

  try {
    const check = await fetch(`https://api.github.com/repos/${repo}`, { headers });
    if (check.status === 401) throw new Error('GitHub connection expired, press ⌘G to reconnect');
    if (check.status === 404) {
      const mine = owner.toLowerCase() === (github.login || '').toLowerCase();
      if (!mine || !confirm(`${repo} doesn't exist yet. Create it as a private repo?`)) {
        throw new Error(`repo ${repo} not found`);
      }
      const created = await fetch('https://api.github.com/user/repos', {
        method: 'POST', headers, body: JSON.stringify({ name, private: true }),
      });
      if (!created.ok) throw new Error((await created.json()).message || created.statusText);
    }

    const images = [...new Set([...n.body.matchAll(/\]\(images\/([\w.-]+)\)/g)].map(m => m[1]))];
    for (const [i, img] of images.entries()) {
      status(`Uploading image ${i + 1} of ${images.length}...`, '', 0);
      const data = nativeImages && await nativeImages.postMessage({ action: 'read', name: img });
      if (data) await putFile(repo, `images/${img}`, data, `Add image ${img} from Termnotes`);
    }

    const content = (n.title ? `# ${n.title}\n\n` : '') + n.body + '\n';
    await putFile(repo, 'README.md', toBase64(content), `Update README from Termnotes: ${n.title || 'Untitled'}`);
    status(`Pushed to github.com/${repo}`, 'ok');
  } catch (err) {
    status(`Push failed: ${err.message}`, 'err');
  }
}

// ---- global shortcuts ----
document.addEventListener('keydown', e => {
  if (promptResolve || !e.metaKey || e.ctrlKey || e.altKey) return;
  const screens = { Comma: 'settings', Slash: 'help' };
  if (screens[e.code]) {
    e.preventDefault();
    screenOpen() === screens[e.code] ? closeScreen() : openScreen(screens[e.code]);
    return;
  }
  if (screenOpen()) return;
  const actions = e.shiftKey ? {
    KeyD: deleteNote,
    KeyL: toggleTheme,
    KeyS: shorthandForSelection,
    KeyC: insertChart,
    KeyI: () => $('filePick').click(),
  } : {
    KeyE: () => setMode(settings.mode === 'write' ? 'preview' : 'write'),
    KeyT: insertTable,
    KeyD: defineTerm,
    KeyS: addShorthand,
    KeyL: () => $('panel').classList.toggle('open'),
    KeyN: newNote,
    KeyP: pushNote,
    KeyG: connectGithub,
  };
  if (actions[e.code]) { e.preventDefault(); actions[e.code](); }
});

// ms = 0 keeps the message up until the next one
let statusTimer;
function status(msg, kind = '', ms = kind === 'err' ? 6000 : 3000) {
  const s = $('status');
  s.textContent = `✻ ${msg}`;
  s.className = kind;
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(() => { s.textContent = '✻ Ready'; s.className = ''; }, ms);
}

render();
setMode(settings.mode);
renderAccount();
applySettings();
status('Ready', '', 0);
// Older versions saved a pasted token without the username
if (github.token && !github.login) finishConnect(github.token);
</script>
