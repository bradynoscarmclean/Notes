<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termnotes</title>
<style>
  :root {
    --bg: #1e1f22;
    --sidebar: #191a1c;
    --fg: #e4e4e4;
    --dim: #7d8088;
    --line: #2d2f33;
    --hover: #26282c;
    --active: #2f3238;
    --yellow: #e5c07b;
    --blue: #61afef;
    --red: #e06c75;
    --selection: rgba(120, 150, 200, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.65 "SF Mono", Menlo, Monaco, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 220px;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px 0;
  }
  .note-item {
    padding: 3px 16px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--dim);
  }
  .note-item:hover { background: var(--hover); color: var(--fg); }
  .note-item.active { background: var(--active); color: var(--fg); }
  #editorWrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #title {
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    font-weight: 600;
    padding: 16px 20px 0;
  }
  #title::placeholder { color: var(--dim); font-weight: normal; }

  /* The textarea sits on top with invisible text; the backdrop underneath draws the coloured text */
  #editorBox { position: relative; flex: 1; min-height: 0; }
  #backdrop, #editor {
    position: absolute;
    inset: 0;
    margin: 0;
    border: none;
    padding: 8px 20px 20px;
    font: inherit;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-wrap: break-word;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #backdrop::-webkit-scrollbar, #editor::-webkit-scrollbar { display: none; }
  #backdrop { color: var(--fg); pointer-events: none; overflow: hidden; }
  #editor {
    background: transparent;
    color: transparent;
    caret-color: var(--fg);
    outline: none;
    resize: none;
  }
  #editor::selection { background: var(--selection); }
  #editor::placeholder { color: var(--dim); }
  .hl-name, .hl-date { color: var(--yellow); }
  .hl-term { color: var(--blue); text-decoration: underline dotted rgba(97, 175, 239, 0.6); text-underline-offset: 3px; }

  #defbar {
    display: none;
    border-top: 1px solid var(--line);
    padding: 6px 20px;
  }
  #defbar.open { display: block; }
  #defbar .term { color: var(--blue); }
  #defbar .dim { color: var(--dim); }

  #panel {
    display: none;
    border-top: 1px solid var(--line);
    padding: 8px 20px;
    max-height: 32vh;
    overflow-y: auto;
  }
  #panel.open { display: block; }
  #panel .heading { color: var(--dim); margin-top: 6px; }
  #panel .heading:first-child { margin-top: 0; }
  #panel .row { display: flex; gap: 12px; }
  #panel .abbr { color: var(--yellow); min-width: 3ch; }
  #panel .term { color: var(--blue); }
  #panel .dim { color: var(--dim); }

  #prompt {
    display: none;
    border-top: 1px solid var(--line);
    background: var(--sidebar);
    padding: 7px 20px;
    align-items: center;
    gap: 8px;
  }
  #prompt.open { display: flex; }
  #promptLabel { color: var(--dim); white-space: nowrap; }
  #promptInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--fg);
  }
  footer {
    padding: 4px 20px;
    background: var(--sidebar);
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    white-space: nowrap;
    overflow: hidden;
  }
  footer kbd { color: var(--fg); font: inherit; }
  #status.ok { color: var(--fg); }
  #status.err { color: var(--red); }
  @media (max-width: 600px) {
    #sidebar { width: 120px; }
  }
</style>
</head>
<body>
<main>
  <nav id="sidebar"><div id="noteList"></div></nav>
  <section id="editorWrap">
    <input id="title" placeholder="Untitled" spellcheck="false">
    <div id="editorBox">
      <div id="backdrop" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" placeholder="Start typing..."></textarea>
    </div>
    <div id="defbar"></div>
    <div id="panel"></div>
    <div id="prompt"><span id="promptLabel"></span><input id="promptInput" spellcheck="false" autocomplete="off"></div>
  </section>
</main>
<footer>
  <span><kbd>⌘D</kbd> define · <kbd>⌥S</kbd> shorthand · <kbd>Tab</kbd> expand · <kbd>⌥L</kbd> lists · <kbd>⌥N</kbd> new · <kbd>⌥D</kbd> delete · <kbd>⌥P</kbd> push to GitHub · <kbd>⌥G</kbd> token</span>
  <span id="status"></span>
</footer>

<script>
const $ = id => document.getElementById(id);
const editor = $('editor'), titleEl = $('title'), backdrop = $('backdrop');

// ---- storage: the Mac app provides window.nativeStore and saves to disk; browsers fall back to localStorage ----
const nativeSave = window.webkit?.messageHandlers?.store;
function load(key, fallback) {
  try {
    const raw = window.nativeStore ? window.nativeStore[key] : localStorage.getItem(key);
    return JSON.parse(raw) ?? fallback;
  } catch { return fallback; }
}
function save(key, val) {
  const raw = JSON.stringify(val);
  try {
    if (nativeSave) { window.nativeStore[key] = raw; nativeSave.postMessage({ key, value: raw }); }
    else localStorage.setItem(key, raw);
  } catch {}
}

let notes = load('termnotes.notes', []);
let shorthands = load('termnotes.shorthands', {});
let dictionary = load('termnotes.dictionary', {}); // lowercased term -> { term, def }
let github = load('termnotes.github', {});
let currentId = load('termnotes.current', null);

if (!notes.length) newNote(false);
if (!notes.find(n => n.id === currentId)) currentId = notes[0].id;

function current() { return notes.find(n => n.id === currentId); }
function persist() { save('termnotes.notes', notes); save('termnotes.current', currentId); }

// ---- notes ----
function newNote(focus = true) {
  const n = { id: Date.now().toString(36), title: '', body: '', updated: Date.now() };
  notes.unshift(n);
  currentId = n.id;
  persist();
  if (focus) { render(); titleEl.focus(); }
}

function deleteNote() {
  const n = current();
  if (!confirm(`Delete "${n.title || 'Untitled'}"?`)) return;
  notes = notes.filter(x => x.id !== n.id);
  if (!notes.length) newNote(false);
  currentId = notes[0].id;
  persist();
  render();
  status('Note deleted', 'ok');
}

function render() {
  const n = current();
  titleEl.value = n.title;
  editor.value = n.body;
  const list = $('noteList');
  list.innerHTML = '';
  for (const note of notes) {
    const div = document.createElement('div');
    div.className = 'note-item' + (note.id === currentId ? ' active' : '');
    div.textContent = note.title || 'Untitled';
    div.onclick = () => { currentId = note.id; persist(); render(); editor.focus(); };
    list.appendChild(div);
  }
  renderPanel();
  renderHighlights();
  updateDefbar();
}

titleEl.addEventListener('input', () => {
  const n = current();
  n.title = titleEl.value; n.updated = Date.now();
  persist();
  render();
});
titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); editor.focus(); }
});
editor.addEventListener('input', () => {
  const n = current();
  n.body = editor.value; n.updated = Date.now();
  persist();
  renderHighlights();
  updateDefbar();
});
editor.addEventListener('scroll', () => { backdrop.scrollTop = editor.scrollTop; });
document.addEventListener('selectionchange', () => { if (document.activeElement === editor) updateDefbar(); });

// ---- highlighting: dictionary terms blue, dates and names yellow ----
const MONTH = '(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)';
const DAY = '\\d{1,2}(?:st|nd|rd|th)?';
const DATE_RE = new RegExp([
  '\\d{4}-\\d{1,2}-\\d{1,2}',
  '\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?',
  `${MONTH}\\.?\\s+${DAY}(?:,?\\s+\\d{4})?`,
  `${DAY}\\s+(?:of\\s+)?${MONTH}(?:,?\\s+\\d{4})?`,
  `${MONTH}\\s+\\d{4}`,
  '(?:January|February|March|April|June|July|August|September|October|November|December)',
  '(?:Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day',
  '(?:[Tt]oday|[Tt]omorrow|[Yy]esterday)',
].map(p => `\\b${p}\\b`).join('|'), 'g');
const NAME_RE = /\b[A-Z][a-z]+(?:[ \t]+[A-Z][a-z]+)*\b/g;

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function dictionaryRegex() {
  const terms = Object.values(dictionary).map(d => d.term).sort((a, b) => b.length - a.length);
  if (!terms.length) return null;
  const parts = terms.map(t => (/^\w/.test(t) ? '\\b' : '') + escapeRegex(t) + (/\w$/.test(t) ? '\\b' : ''));
  return new RegExp(parts.join('|'), 'gi');
}

function findRanges(text) {
  const ranges = [];
  const free = (s, e) => !ranges.some(r => s < r.end && e > r.start);
  const add = (re, cls) => {
    if (!re) return;
    for (const m of text.matchAll(re)) {
      let start = m.index;
      const end = start + m[0].length;
      if (cls === 'hl-name' && /(^|[.!?]\s*|\n\s*)$/.test(text.slice(0, start))) {
        // The first word of a sentence is capitalised anyway, so it isn't treated as a name
        const gap = m[0].search(/\s/);
        if (gap < 0) continue;
        start += m[0].slice(gap).search(/\S/) + gap;
      }
      if (start < end && free(start, end)) ranges.push({ start, end, cls });
    }
  };
  add(dictionaryRegex(), 'hl-term');
  add(DATE_RE, 'hl-date');
  add(NAME_RE, 'hl-name');
  return ranges.sort((a, b) => a.start - b.start);
}

function renderHighlights() {
  const text = editor.value;
  let html = '', pos = 0;
  for (const r of findRanges(text)) {
    html += escapeHtml(text.slice(pos, r.start)) + `<span class="${r.cls}">${escapeHtml(text.slice(r.start, r.end))}</span>`;
    pos = r.end;
  }
  // Trailing newline + space keeps the backdrop's height matching the textarea's
  backdrop.innerHTML = html + escapeHtml(text.slice(pos)) + '\n ';
  backdrop.scrollTop = editor.scrollTop;
}

// Shows the definition when the cursor is on a dictionary word
function updateDefbar() {
  const bar = $('defbar');
  const re = dictionaryRegex();
  const pos = editor.selectionStart;
  let hit = null;
  if (re) for (const m of editor.value.matchAll(re)) {
    if (pos >= m.index && pos <= m.index + m[0].length) { hit = dictionary[m[0].toLowerCase()]; break; }
  }
  bar.classList.toggle('open', !!hit);
  if (hit) bar.innerHTML = `<span class="term">${escapeHtml(hit.term)}</span> <span class="dim">·</span> ${escapeHtml(hit.def)}`;
}

// ---- shorthand expansion on Tab ----
editor.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.altKey || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const pos = editor.selectionStart;
  const before = editor.value.slice(0, pos);
  const m = before.match(/(?:^|[^A-Za-z])([A-Za-z]{2})$/);
  const abbr = m && m[1];
  const full = abbr && shorthands[abbr.toLowerCase()];
  if (full) {
    // Keep capitalisation if the shorthand was typed with a capital first letter
    const word = abbr[0] === abbr[0].toUpperCase() ? full[0].toUpperCase() + full.slice(1) : full;
    editor.setRangeText(word, pos - 2, pos, 'end');
  } else {
    editor.setRangeText('  ', pos, editor.selectionEnd, 'end');
  }
  editor.dispatchEvent(new Event('input'));
});

// ---- bottom prompt: ask(label) resolves with the typed text, or null on Esc ----
const promptEl = $('prompt'), promptInput = $('promptInput'), promptLabel = $('promptLabel');
let promptResolve = null, returnFocus = null;

function ask(label, { value = '', maxLength, secret = false } = {}) {
  if (!promptResolve) returnFocus = document.activeElement;
  promptLabel.textContent = label;
  promptInput.value = value;
  promptInput.type = secret ? 'password' : 'text';
  if (maxLength) promptInput.maxLength = maxLength; else promptInput.removeAttribute('maxlength');
  promptEl.classList.add('open');
  promptInput.focus();
  promptInput.select();
  return new Promise(resolve => { promptResolve = resolve; });
}
function finishPrompt(result) {
  const resolve = promptResolve;
  promptResolve = null;
  promptEl.classList.remove('open');
  (returnFocus || editor).focus();
  resolve(result);
}
promptInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); finishPrompt(null); status('Cancelled'); }
  else if (e.key === 'Enter') { e.preventDefault(); finishPrompt(promptInput.value.trim()); }
});

// ---- dictionary (Cmd+D) ----
function selectedTerm() {
  let { selectionStart: s, selectionEnd: e, value } = editor;
  if (s === e) {
    // Nothing selected: use the word the cursor is in
    while (s > 0 && /[\w'-]/.test(value[s - 1])) s--;
    while (e < value.length && /[\w'-]/.test(value[e])) e++;
  }
  return value.slice(s, e).trim().replace(/\s+/g, ' ');
}

async function defineTerm() {
  const term = selectedTerm();
  if (!term) { status('Select a word first', 'err'); return; }
  if (term.length > 60) { status('Selection is too long to define', 'err'); return; }
  const key = term.toLowerCase();
  const existing = dictionary[key];
  const def = await ask(`Define "${term}" (blank = remove):`, { value: existing ? existing.def : '' });
  if (def === null) return;
  if (def) {
    dictionary[key] = { term: existing ? existing.term : term, def };
    status(`Defined "${term}"`, 'ok');
  } else if (existing) {
    delete dictionary[key];
    status(`Removed "${term}"`, 'ok');
  } else {
    return;
  }
  save('termnotes.dictionary', dictionary);
  renderPanel();
  renderHighlights();
  updateDefbar();
}

// ---- shorthand (Option+S) ----
async function addShorthand() {
  let abbr;
  while (true) {
    abbr = await ask('Shorthand (2 letters):', { maxLength: 2 });
    if (abbr === null) return;
    if (/^[A-Za-z]{2}$/.test(abbr)) break;
    status('Shorthand must be exactly 2 letters', 'err');
  }
  abbr = abbr.toLowerCase();
  const existing = shorthands[abbr];
  const full = await ask(`"${abbr}" expands to (blank = remove):`, { value: existing || '' });
  if (full === null) return;
  if (full) {
    shorthands[abbr] = full;
    status(`Added ${abbr} → ${full}`, 'ok');
  } else if (existing) {
    delete shorthands[abbr];
    status(`Removed ${abbr}`, 'ok');
  } else {
    status('Nothing to remove');
  }
  save('termnotes.shorthands', shorthands);
  renderPanel();
}

function renderPanel() {
  const box = $('panel');
  box.innerHTML = '';
  const section = (title, entries, emptyMsg, keyClass) => {
    box.insertAdjacentHTML('beforeend', `<div class="heading">${title}</div>`);
    if (!entries.length) box.insertAdjacentHTML('beforeend', `<div class="dim">${emptyMsg}</div>`);
    for (const [k, v] of entries) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="${keyClass}"></span><span class="dim">→</span><span></span>`;
      row.children[0].textContent = k;
      row.children[2].textContent = v;
      box.appendChild(row);
    }
  };
  section('Shorthands', Object.keys(shorthands).sort().map(k => [k, shorthands[k]]),
    'None yet. Press ⌥S to add one.', 'abbr');
  section('Dictionary', Object.values(dictionary).sort((a, b) => a.term.localeCompare(b.term)).map(d => [d.term, d.def]),
    'None yet. Select a word and press ⌘D.', 'term');
}

// ---- GitHub push (Option+P) ----
async function setToken() {
  const token = await ask('GitHub token (blank = forget):', { secret: true });
  if (token === null) return false;
  if (token) { github.token = token; status('Token saved', 'ok'); }
  else { delete github.token; status('Token removed', 'ok'); }
  save('termnotes.github', github);
  return !!token;
}

function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function pushNote() {
  const n = current();
  if (!github.token && !(await setToken())) return;

  const repo = await ask('Push README.md to repo (owner/name):', { value: n.repo || github.repo || '' });
  if (!repo) return;
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { status('Repo must look like owner/name', 'err'); return; }
  n.repo = github.repo = repo;
  persist();
  save('termnotes.github', github);

  const url = `https://api.github.com/repos/${repo}/contents/README.md`;
  const headers = {
    Authorization: `Bearer ${github.token}`,
    Accept: 'application/vnd.github+json',
  };
  const content = (n.title ? `# ${n.title}\n\n` : '') + n.body + '\n';
  status(`Pushing to ${repo}...`);

  try {
    // Updating an existing README requires its current sha
    let sha;
    const existing = await fetch(url, { headers });
    if (existing.ok) sha = (await existing.json()).sha;
    else if (existing.status === 401) throw new Error('bad token (press ⌥G to set a new one)');

    const res = await fetch(url, {
      method: 'PUT',
      headers,
      body: JSON.stringify({
        message: `Update README from Termnotes: ${n.title || 'Untitled'}`,
        content: toBase64(content),
        ...(sha && { sha }),
      }),
    });
    if (!res.ok) {
      if (res.status === 401) throw new Error('bad token (press ⌥G to set a new one)');
      if (res.status === 404) throw new Error(`repo ${repo} not found, or the token can't write to it`);
      throw new Error((await res.json()).message || res.statusText);
    }
    status(`Pushed to github.com/${repo}`, 'ok');
  } catch (err) {
    status(`Push failed: ${err.message}`, 'err');
  }
}

// ---- global shortcuts (use e.code: Option+S on a Mac types "ß") ----
document.addEventListener('keydown', e => {
  if (promptResolve || e.ctrlKey) return;
  if (e.metaKey && !e.altKey && !e.shiftKey && e.code === 'KeyD') {
    e.preventDefault();
    defineTerm();
    return;
  }
  if (!e.altKey || e.metaKey) return;
  const actions = {
    KeyS: addShorthand,
    KeyL: () => $('panel').classList.toggle('open'),
    KeyN: newNote,
    KeyD: deleteNote,
    KeyP: pushNote,
    KeyG: setToken,
  };
  if (actions[e.code]) { e.preventDefault(); actions[e.code](); }
});

let statusTimer;
function status(msg, kind = '') {
  const s = $('status');
  s.textContent = msg;
  s.className = kind;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { s.textContent = ''; }, kind === 'err' ? 6000 : 3000);
}

render();
editor.focus();
</script>
</body>
</html>
