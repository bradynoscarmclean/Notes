<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termnotes</title>
<script>
  // Set the theme before first paint so there's no flash
  try {
    if (window.nativeStore) document.documentElement.classList.add('native');
    const t = JSON.parse(window.nativeStore ? window.nativeStore['termnotes.theme'] : localStorage.getItem('termnotes.theme'));
    if (t && t !== 'system') document.documentElement.dataset.theme = t;
    const s = JSON.parse(window.nativeStore ? window.nativeStore['termnotes.settings'] : localStorage.getItem('termnotes.settings'));
    if (s && s.size) document.documentElement.style.setProperty('--size', s.size + 'px');
  } catch {}
</script>
<style>
  :root {
    --size: 12.5px;
    --fg: #e4e7ec;
    --bold: #ffffff;
    --dim: #8a93a5;
    --yellow: #ecc66c;
    --green: #8fd694;
    --blue: #7cc0ff;
    --red: #f28b82;
    --rule: rgba(255, 255, 255, 0.13);
    --selection: rgba(124, 192, 255, 0.28);
    --tint: rgba(17, 23, 37, 0.55);
    --fallback: linear-gradient(105deg, #191d29 0%, #1e2536 55%, #2a3652 100%);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --fg: #24292f; --bold: #000000; --dim: #6e7781; --yellow: #9a6700; --green: #1a7f37; --blue: #0969da; --red: #cf222e;
      --rule: rgba(0, 0, 0, 0.12); --selection: rgba(9, 105, 218, 0.18);
      --tint: rgba(255, 255, 255, 0.5);
      --fallback: linear-gradient(105deg, #f7f8fa 0%, #eef1f6 55%, #e3e9f3 100%);
    }
  }
  :root[data-theme="light"] {
    --fg: #24292f; --bold: #000000; --dim: #6e7781; --yellow: #9a6700; --green: #1a7f37; --blue: #0969da; --red: #cf222e;
    --rule: rgba(0, 0, 0, 0.12); --selection: rgba(9, 105, 218, 0.18);
    --tint: rgba(255, 255, 255, 0.5);
    --fallback: linear-gradient(105deg, #f7f8fa 0%, #eef1f6 55%, #e3e9f3 100%);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fallback);
    color: var(--fg);
    font: var(--size)/1.6 "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  /* In the Mac app the window itself is see-through and blurred; the page just adds a tint */
  html.native body { background: var(--tint); padding-top: 28px; }
  b, strong { color: var(--bold); font-weight: 700; }
  .dim { color: var(--dim); }

  main { flex: 1; display: flex; gap: 36px; min-height: 0; padding: 14px 24px 0; }

  #sidebar { width: 190px; flex-shrink: 0; display: flex; flex-direction: column; }
  #notesHeader { color: var(--dim); margin-bottom: 8px; }
  #noteList { flex: 1; overflow-y: auto; scrollbar-width: none; }
  #noteList::-webkit-scrollbar { display: none; }
  .note-item {
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--dim);
  }
  .note-item::before { content: "  "; white-space: pre; }
  .note-item:hover { color: var(--fg); }
  .note-item.active { color: var(--bold); font-weight: 700; }
  .note-item.active::before { content: "● "; }
  #account { color: var(--dim); padding: 10px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #editorWrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #title {
    background: transparent;
    border: none;
    outline: none;
    padding: 0 0 6px;
    color: var(--yellow);
    font: inherit;
    font-size: calc(var(--size) * 1.55);
    font-weight: 700;
    line-height: 1.3;
  }
  #title::placeholder { color: var(--dim); font-weight: normal; }

  /* The textarea sits on top with invisible text; the backdrop underneath draws the coloured text */
  #editorBox { position: relative; flex: 1; min-height: 0; margin-top: 2px; }
  #backdrop, #editor {
    position: absolute;
    inset: 0;
    margin: 0;
    border: none;
    padding: 0 0 24px;
    font: inherit;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-wrap: break-word;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #backdrop::-webkit-scrollbar, #editor::-webkit-scrollbar { display: none; }
  #backdrop { color: var(--fg); pointer-events: none; overflow: hidden; }
  #editor {
    background: transparent;
    color: transparent;
    caret-color: var(--bold);
    outline: none;
    resize: none;
  }
  #editor::selection { background: var(--selection); }
  #editor::placeholder { color: var(--dim); }
  .hl-name, .hl-date { color: var(--green); }
  .hl-term { color: var(--blue); }

  #defbar { display: none; color: var(--dim); padding: 8px 0 0; }
  #defbar.open { display: block; }
  #defbar .term { color: var(--blue); }

  #panel { display: none; padding: 10px 0 0; max-height: 34vh; overflow-y: auto; scrollbar-width: none; }
  #panel.open { display: block; }
  #panel .heading { margin-top: 10px; }
  #panel .heading:first-child { margin-top: 0; }
  #panel .row { padding-left: 2ch; }
  #panel .term { color: var(--blue); }

  /* Settings replace the editor while open */
  #settings { display: none; outline: none; overflow-y: auto; }
  #editorWrap.settings-open > :not(#settings):not(#prompt) { display: none; }
  #editorWrap.settings-open #settings { display: block; }
  #settings h2 { margin: 0 0 4px; font-size: calc(var(--size) * 1.55); line-height: 1.3; color: var(--yellow); }
  #settings .hint { color: var(--dim); margin-bottom: 14px; }
  .setting { cursor: pointer; padding: 1px 0; color: var(--fg); white-space: pre-wrap; }
  .setting::before { content: "  "; }
  .setting.sel { color: var(--bold); font-weight: 700; }
  .setting.sel::before { content: "❯ "; }
  .setting .val { color: var(--blue); }
  .setting .note { color: var(--dim); font-weight: normal; }

  #prompt {
    display: none;
    margin-top: 10px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
    align-items: center;
  }
  #prompt.open { display: flex; }
  #promptLabel { color: var(--dim); white-space: pre; }
  #promptInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    color: var(--fg);
    font: inherit;
    caret-color: var(--bold);
  }

  footer { padding: 12px 24px 14px; color: var(--dim); }
  footer > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.ok { color: var(--fg); }
  #status.err { color: var(--red); }
  #keys { margin-top: 2px; }
  #keys b { font-weight: 700; }

  @media (max-width: 640px) {
    main { gap: 20px; padding: 12px 16px 0; }
    footer { padding: 10px 16px 12px; }
    #sidebar { width: 110px; }
  }
</style>
</head>
<body>
<main>
  <nav id="sidebar">
    <div id="notesHeader"></div>
    <div id="noteList"></div>
    <div id="account"></div>
  </nav>
  <section id="editorWrap">
    <input id="title" placeholder="Untitled" spellcheck="false">
    <div id="settings" tabindex="0"></div>
    <div id="editorBox">
      <div id="backdrop" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" placeholder="Start typing..."></textarea>
    </div>
    <div id="defbar"></div>
    <div id="panel"></div>
    <div id="prompt"><span id="promptLabel"></span><input id="promptInput" spellcheck="false" autocomplete="off"></div>
  </section>
</main>
<footer>
  <div id="status"></div>
  <div id="keys"><b>⌘,</b> settings · <b>⌘D</b> define · <b>⌘S</b> shorthand · <b>⌘⇧S</b> shorthand from selection · <b>Tab</b> expand · <b>⌘L</b> lists · <b>⌘N</b> new · <b>⌘⇧D</b> delete · <b>⌘P</b> push · <b>⌘G</b> GitHub</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const editor = $('editor'), titleEl = $('title'), backdrop = $('backdrop');

// ---- storage: the Mac app provides window.nativeStore and saves to disk; browsers fall back to localStorage ----
const nativeSave = window.webkit?.messageHandlers?.store;
function load(key, fallback) {
  try {
    const raw = window.nativeStore ? window.nativeStore[key] : localStorage.getItem(key);
    return JSON.parse(raw) ?? fallback;
  } catch { return fallback; }
}
function save(key, val) {
  const raw = JSON.stringify(val);
  try {
    if (nativeSave) { window.nativeStore[key] = raw; nativeSave.postMessage({ key, value: raw }); }
    else localStorage.setItem(key, raw);
  } catch {}
}

let notes = load('termnotes.notes', []);
let shorthands = load('termnotes.shorthands', {});
let dictionary = load('termnotes.dictionary', {}); // lowercased term -> { term, def }
let github = load('termnotes.github', {});
let currentId = load('termnotes.current', null);
let settings = {
  autoExpand: false, names: true, dates: true, terms: true, size: 12.5, showKeys: true,
  ...load('termnotes.settings', {}),
};

if (!notes.length) newNote(false);
if (!notes.find(n => n.id === currentId)) currentId = notes[0].id;

function current() { return notes.find(n => n.id === currentId); }
function persist() { save('termnotes.notes', notes); save('termnotes.current', currentId); }

// ---- notes ----
function newNote(focus = true) {
  const n = { id: Date.now().toString(36), title: '', body: '', updated: Date.now() };
  notes.unshift(n);
  currentId = n.id;
  persist();
  if (focus) { render(); titleEl.focus(); }
}

function deleteNote() {
  const n = current();
  if (!confirm(`Delete "${n.title || 'Untitled'}"?`)) return;
  notes = notes.filter(x => x.id !== n.id);
  if (!notes.length) newNote(false);
  currentId = notes[0].id;
  persist();
  render();
  status('Note deleted', 'ok');
}

function render() {
  const n = current();
  titleEl.value = n.title;
  editor.value = n.body;
  $('notesHeader').innerHTML = `Listed <b>${notes.length}</b> note${notes.length === 1 ? '' : 's'}`;
  const list = $('noteList');
  list.innerHTML = '';
  for (const note of notes) {
    const div = document.createElement('div');
    div.className = 'note-item' + (note.id === currentId ? ' active' : '');
    div.textContent = note.title || 'Untitled';
    div.onclick = () => { currentId = note.id; persist(); render(); editor.focus(); };
    list.appendChild(div);
  }
  renderPanel();
  renderHighlights();
  updateDefbar();
}

function savedStatus() {
  status(`Saved · ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`, '', 0);
}

titleEl.addEventListener('input', () => {
  const n = current();
  n.title = titleEl.value; n.updated = Date.now();
  persist();
  render();
  savedStatus();
});
titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); editor.focus(); }
});
editor.addEventListener('input', () => {
  const n = current();
  n.body = editor.value; n.updated = Date.now();
  persist();
  renderHighlights();
  updateDefbar();
  savedStatus();
});
editor.addEventListener('scroll', () => { backdrop.scrollTop = editor.scrollTop; });
document.addEventListener('selectionchange', () => { if (document.activeElement === editor) updateDefbar(); });

// ---- highlighting: dictionary terms blue, dates, times and names green ----
const MONTH = '(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const DAY = '\\d{1,2}(?:st|nd|rd|th)?';
const DATE_RE = new RegExp([
  '\\d{4}-\\d{1,2}-\\d{1,2}',
  '\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?',
  // Dashes and dots need a year, so "5-6 people" and "1.5" aren't dates
  '\\d{1,2}([.-])\\d{1,2}\\1\\d{2,4}',
  `${MONTH}\\.?\\s+${DAY}(?:,?\\s+\\d{4})?`,
  `${DAY}\\s+(?:of\\s+)?${MONTH}(?:,?\\s+\\d{4})?`,
  `${MONTH}\\s+\\d{4}`,
  // "May" and "March" on their own are too often ordinary words
  '(?:january|february|april|june|july|august|september|october|november|december)',
  '(?:(?:next|last|this)\\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)day',
  '(?:today|tonight|tomorrow|yesterday)',
  '\\d{1,2}(?::\\d{2})?\\s?[ap]\\.?m\\.?',
  '\\d{1,2}:\\d{2}',
].map(p => `\\b${p}(?![\\w])`).join('|'), 'gi');
const NAME_RE = /\b[A-Z][a-z]+(?:[ \t]+[A-Z][a-z]+)*\b/g;

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function dictionaryRegex() {
  const terms = Object.values(dictionary).map(d => d.term).sort((a, b) => b.length - a.length);
  if (!terms.length) return null;
  const parts = terms.map(t => (/^\w/.test(t) ? '\\b' : '') + escapeRegex(t) + (/\w$/.test(t) ? '\\b' : ''));
  return new RegExp(parts.join('|'), 'gi');
}

function findRanges(text) {
  const ranges = [];
  const free = (s, e) => !ranges.some(r => s < r.end && e > r.start);
  const add = (re, cls) => {
    if (!re) return;
    for (const m of text.matchAll(re)) {
      let start = m.index;
      const end = start + m[0].length;
      if (cls === 'hl-name' && /(^|[.!?]\s*|\n\s*)$/.test(text.slice(0, start))) {
        // The first word of a sentence is capitalised anyway, so it isn't treated as a name
        const gap = m[0].search(/\s/);
        if (gap < 0) continue;
        start += m[0].slice(gap).search(/\S/) + gap;
      }
      if (start < end && free(start, end)) ranges.push({ start, end, cls });
    }
  };
  if (settings.terms) add(dictionaryRegex(), 'hl-term');
  if (settings.dates) add(DATE_RE, 'hl-date');
  if (settings.names) add(NAME_RE, 'hl-name');
  return ranges.sort((a, b) => a.start - b.start);
}

function renderHighlights() {
  const text = editor.value;
  let html = '', pos = 0;
  for (const r of findRanges(text)) {
    html += escapeHtml(text.slice(pos, r.start)) + `<span class="${r.cls}">${escapeHtml(text.slice(r.start, r.end))}</span>`;
    pos = r.end;
  }
  // Trailing newline + space keeps the backdrop's height matching the textarea's
  backdrop.innerHTML = html + escapeHtml(text.slice(pos)) + '\n ';
  backdrop.scrollTop = editor.scrollTop;
}

// Shows the definition when the cursor is on a dictionary word
function updateDefbar() {
  const bar = $('defbar');
  const re = dictionaryRegex();
  const pos = editor.selectionStart;
  let hit = null;
  if (re) for (const m of editor.value.matchAll(re)) {
    if (pos >= m.index && pos <= m.index + m[0].length) { hit = dictionary[m[0].toLowerCase()]; break; }
  }
  bar.classList.toggle('open', !!hit);
  if (hit) bar.innerHTML = `⎿  <span class="term">${escapeHtml(hit.term)}</span>: ${escapeHtml(hit.def)}`;
}

// ---- shorthand expansion: on Tab, or automatically after a space/punctuation if that setting is on ----
// Replaces a two-letter shorthand ending at `end`; returns the length change, or null if there was none
function expandAt(end) {
  const m = editor.value.slice(0, end).match(/(?:^|[^A-Za-z])([A-Za-z]{2})$/);
  const abbr = m && m[1];
  const full = abbr && shorthands[abbr.toLowerCase()];
  if (!full) return null;
  // Keep capitalisation if the shorthand was typed with a capital first letter
  const word = abbr[0] === abbr[0].toUpperCase() ? full[0].toUpperCase() + full.slice(1) : full;
  editor.setRangeText(word, end - 2, end, 'preserve');
  return word.length - 2;
}

editor.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.altKey || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const pos = editor.selectionStart;
  const grew = expandAt(pos);
  if (grew === null) editor.setRangeText('  ', pos, editor.selectionEnd, 'end');
  else editor.setSelectionRange(pos + grew, pos + grew);
  editor.dispatchEvent(new Event('input'));
});

editor.addEventListener('input', e => {
  if (!settings.autoExpand) return;
  const typedBreak = e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph'
    || (e.inputType === 'insertText' && /^[^A-Za-z0-9'-]$/.test(e.data));
  if (!typedBreak) return;
  const pos = editor.selectionStart;
  const grew = expandAt(pos - 1);
  if (grew === null) return;
  editor.setSelectionRange(pos + grew, pos + grew);
  editor.dispatchEvent(new Event('input'));
});

// ---- bottom prompt: ask(label) resolves with the typed text, or null on Esc ----
const promptEl = $('prompt'), promptInput = $('promptInput'), promptLabel = $('promptLabel');
let promptResolve = null, returnFocus = null;

function ask(label, { value = '', maxLength, secret = false } = {}) {
  if (!promptResolve) returnFocus = document.activeElement;
  promptLabel.textContent = `❯ ${label} `;
  promptInput.value = value;
  promptInput.type = secret ? 'password' : 'text';
  if (maxLength) promptInput.maxLength = maxLength; else promptInput.removeAttribute('maxlength');
  promptEl.classList.add('open');
  promptInput.focus();
  promptInput.select();
  return new Promise(resolve => { promptResolve = resolve; });
}
function finishPrompt(result) {
  const resolve = promptResolve;
  promptResolve = null;
  promptEl.classList.remove('open');
  (returnFocus || editor).focus();
  resolve(result);
}
promptInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); finishPrompt(null); status('Cancelled'); }
  else if (e.key === 'Enter') { e.preventDefault(); finishPrompt(promptInput.value.trim()); }
});

// ---- dictionary (Cmd+D) ----
function selectedTerm() {
  let { selectionStart: s, selectionEnd: e, value } = editor;
  if (s === e) {
    // Nothing selected: use the word the cursor is in
    while (s > 0 && /[\w'-]/.test(value[s - 1])) s--;
    while (e < value.length && /[\w'-]/.test(value[e])) e++;
  }
  return value.slice(s, e).trim().replace(/\s+/g, ' ');
}

async function defineTerm() {
  const term = selectedTerm();
  if (!term) { status('Select a word first', 'err'); return; }
  if (term.length > 60) { status('Selection is too long to define', 'err'); return; }
  const key = term.toLowerCase();
  const existing = dictionary[key];
  const def = await ask(`Define "${term}" (blank = remove):`, { value: existing ? existing.def : '' });
  if (def === null) return;
  if (def) {
    dictionary[key] = { term: existing ? existing.term : term, def };
    status(`Defined "${term}"`, 'ok');
  } else if (existing) {
    delete dictionary[key];
    status(`Removed "${term}"`, 'ok');
  } else {
    return;
  }
  save('termnotes.dictionary', dictionary);
  renderPanel();
  renderHighlights();
  updateDefbar();
}

// ---- shorthand (Cmd+S, and Cmd+Shift+S for the selected word) ----
async function askAbbr(label) {
  while (true) {
    const abbr = await ask(label, { maxLength: 2 });
    if (abbr === null) return null;
    if (/^[A-Za-z]{2}$/.test(abbr)) return abbr.toLowerCase();
    status('Shorthand must be exactly 2 letters', 'err');
  }
}

async function shorthandForSelection() {
  const word = selectedTerm();
  if (!word) { status('Select a word first', 'err'); return; }
  const abbr = await askAbbr(`Shorthand for "${word}" (2 letters):`);
  if (abbr === null) return;
  const replaced = shorthands[abbr];
  shorthands[abbr] = word;
  save('termnotes.shorthands', shorthands);
  renderPanel();
  status(`Added ${abbr} → ${word}${replaced && replaced !== word ? ` (replaced ${replaced})` : ''}`, 'ok');
}

async function addShorthand() {
  const abbr = await askAbbr('Shorthand (2 letters):');
  if (abbr === null) return;
  const existing = shorthands[abbr];
  const full = await ask(`"${abbr}" expands to (blank = remove):`, { value: existing || '' });
  if (full === null) return;
  if (full) {
    shorthands[abbr] = full;
    status(`Added ${abbr} → ${full}`, 'ok');
  } else if (existing) {
    delete shorthands[abbr];
    status(`Removed ${abbr}`, 'ok');
  } else {
    status('Nothing to remove');
  }
  save('termnotes.shorthands', shorthands);
  renderPanel();
}

function renderPanel() {
  const box = $('panel');
  box.innerHTML = '';
  const section = (title, entries, emptyMsg, keyClass) => {
    box.insertAdjacentHTML('beforeend', `<div class="heading"><b>${title}</b></div>`);
    if (!entries.length) box.insertAdjacentHTML('beforeend', `<div class="row dim">${emptyMsg}</div>`);
    for (const [k, v] of entries) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="${keyClass}"></span> <span class="dim">→</span> <span></span>`;
      row.children[0].textContent = k;
      row.children[2].textContent = v;
      box.appendChild(row);
    }
  };
  section('Shorthands', Object.keys(shorthands).sort().map(k => [k, shorthands[k]]),
    'None yet. Press ⌘S to add one.', '');
  section('Dictionary', Object.values(dictionary).sort((a, b) => a.term.localeCompare(b.term)).map(d => [d.term, d.def]),
    'None yet. Select a word and press ⌘D.', 'term');
}

// ---- theme: 'system', 'dark' or 'light' (Cmd+Shift+L flips light/dark) ----
function setTheme(mode) {
  if (mode === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  save('termnotes.theme', mode);
  window.webkit?.messageHandlers?.theme?.postMessage(mode);
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(dark ? 'light' : 'dark');
  status(dark ? 'Light mode' : 'Dark mode', 'ok');
  if (settingsOpen()) renderSettings();
}

// ---- settings (Cmd+,) ----
const capitalise = s => s[0].toUpperCase() + s.slice(1);
const SETTINGS = [
  { key: 'autoExpand', label: 'Expand shorthands without pressing Tab', note: 'after a space, punctuation or new line' },
  { key: 'names', label: 'Highlight names' },
  { key: 'dates', label: 'Highlight dates and times' },
  { key: 'terms', label: 'Highlight dictionary words' },
  { key: 'size', label: 'Text size', options: [11, 12, 12.5, 13, 13.5, 14, 15, 16], format: v => `${v}px` },
  { key: 'theme', label: 'Theme', options: ['system', 'dark', 'light'], format: capitalise },
  { key: 'showKeys', label: 'Show shortcuts at the bottom' },
];
let settingIndex = 0;

const settingsOpen = () => $('editorWrap').classList.contains('settings-open');
const settingValue = s => s.key === 'theme' ? load('termnotes.theme', 'system') : settings[s.key];

function applySettings() {
  document.documentElement.style.setProperty('--size', settings.size + 'px');
  $('keys').style.display = settings.showKeys ? '' : 'none';
  renderHighlights();
  updateDefbar();
}

function changeSetting(s, step = 1) {
  if (s.options) {
    const i = s.options.indexOf(settingValue(s));
    const next = s.options[(i + step + s.options.length) % s.options.length];
    if (s.key === 'theme') setTheme(next);
    else settings[s.key] = next;
  } else {
    settings[s.key] = !settings[s.key];
  }
  save('termnotes.settings', settings);
  applySettings();
  renderSettings();
}

function renderSettings() {
  const box = $('settings');
  box.innerHTML = '<h2>Settings</h2><div class="hint">↑↓ to move · Space or ←→ to change · Esc to close</div>';
  SETTINGS.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'setting' + (i === settingIndex ? ' sel' : '');
    const value = settingValue(s);
    const shown = s.options ? `‹ ${s.format(value)} ›` : value ? '[x]' : '[ ]';
    row.innerHTML = s.options
      ? `${escapeHtml(s.label)}  <span class="val">${escapeHtml(shown)}</span>`
      : `<span class="val">${shown}</span> ${escapeHtml(s.label)}${s.note ? `  <span class="note">${escapeHtml(s.note)}</span>` : ''}`;
    row.onclick = () => { settingIndex = i; changeSetting(s); };
    box.appendChild(row);
  });
}

function openSettings() {
  if (promptResolve) return;
  $('editorWrap').classList.add('settings-open');
  renderSettings();
  $('settings').focus();
}
function closeSettings() {
  $('editorWrap').classList.remove('settings-open');
  editor.focus();
}
window.openSettings = openSettings;

$('settings').addEventListener('keydown', e => {
  const s = SETTINGS[settingIndex];
  const keys = {
    ArrowUp: () => { settingIndex = (settingIndex + SETTINGS.length - 1) % SETTINGS.length; renderSettings(); },
    ArrowDown: () => { settingIndex = (settingIndex + 1) % SETTINGS.length; renderSettings(); },
    ArrowLeft: () => changeSetting(s, -1),
    ArrowRight: () => changeSetting(s, 1),
    ' ': () => changeSetting(s, 1),
    Enter: () => changeSetting(s, 1),
    Escape: closeSettings,
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});

// ---- GitHub account (Cmd+G) ----
const nativeGithub = window.webkit?.messageHandlers?.github;
const ghHeaders = token => ({ Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' });

function renderAccount() {
  const el = $('account');
  if (github.login) el.innerHTML = `GitHub <b></b>`, el.querySelector('b').textContent = '@' + github.login;
  else el.innerHTML = 'GitHub off · <b>⌘G</b>';
}

async function connectGithub() {
  if (github.token) {
    if (!confirm(`Disconnect GitHub account @${github.login || 'unknown'}?`)) return;
    github = { repo: github.repo };
    save('termnotes.github', github);
    renderAccount();
    status('GitHub disconnected', 'ok');
    return;
  }
  if (nativeGithub && window.hasGitHubApp) {
    // The Mac app runs GitHub's sign-in and calls window.githubLogin with the progress
    status('Opening GitHub sign-in...');
    nativeGithub.postMessage({ action: 'login' });
    return;
  }
  const token = await ask('GitHub token:', { secret: true });
  if (token) finishConnect(token);
}

async function finishConnect(token) {
  try {
    const res = await fetch('https://api.github.com/user', { headers: ghHeaders(token) });
    if (!res.ok) throw new Error(res.status === 401 ? 'GitHub rejected the sign-in' : res.statusText);
    github.token = token;
    github.login = (await res.json()).login;
    save('termnotes.github', github);
    renderAccount();
    status(`Connected to GitHub as @${github.login}`, 'ok');
  } catch (err) {
    status(`GitHub connect failed: ${err.message}`, 'err');
  }
}

window.githubLogin = msg => {
  if (msg.code) status(`In your browser, enter code ${msg.code} (already copied)`, 'ok', 0);
  else if (msg.token) finishConnect(msg.token);
  else if (msg.error) status(`GitHub sign-in failed: ${msg.error}`, 'err');
};

// ---- GitHub push (Cmd+P) ----
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function putReadme(repo, content, title) {
  const url = `https://api.github.com/repos/${repo}/contents/README.md`;
  const headers = ghHeaders(github.token);
  // Updating an existing README requires its current sha
  let sha;
  const existing = await fetch(url, { headers });
  if (existing.ok) sha = (await existing.json()).sha;
  return fetch(url, {
    method: 'PUT',
    headers,
    body: JSON.stringify({
      message: `Update README from Termnotes: ${title || 'Untitled'}`,
      content: toBase64(content),
      ...(sha && { sha }),
    }),
  });
}

async function pushNote() {
  const n = current();
  if (!github.token) { status('Connect your GitHub account first (⌘G)', 'err'); return; }

  let repo = await ask('Push README.md to repo:', { value: n.repo || github.repo || '' });
  if (!repo) return;
  if (!repo.includes('/') && github.login) repo = `${github.login}/${repo}`;
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { status('Repo must look like name or owner/name', 'err'); return; }
  n.repo = github.repo = repo;
  persist();
  save('termnotes.github', github);

  const content = (n.title ? `# ${n.title}\n\n` : '') + n.body + '\n';
  const [owner, name] = repo.split('/');
  status(`Pushing to ${repo}...`, '', 0);

  try {
    let res = await putReadme(repo, content, n.title);
    if (res.status === 404 && owner.toLowerCase() === (github.login || '').toLowerCase()
        && confirm(`${repo} doesn't exist yet. Create it as a private repo?`)) {
      const created = await fetch('https://api.github.com/user/repos', {
        method: 'POST',
        headers: ghHeaders(github.token),
        body: JSON.stringify({ name, private: true }),
      });
      if (!created.ok) throw new Error((await created.json()).message || created.statusText);
      res = await putReadme(repo, content, n.title);
    }
    if (!res.ok) {
      if (res.status === 401) throw new Error('GitHub connection expired, press ⌘G to reconnect');
      if (res.status === 404) throw new Error(`repo ${repo} not found, or your account can't write to it`);
      throw new Error((await res.json()).message || res.statusText);
    }
    status(`Pushed to github.com/${repo}`, 'ok');
  } catch (err) {
    status(`Push failed: ${err.message}`, 'err');
  }
}

// ---- global shortcuts ----
document.addEventListener('keydown', e => {
  if (promptResolve || !e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Comma') {
    e.preventDefault();
    settingsOpen() ? closeSettings() : openSettings();
    return;
  }
  if (settingsOpen()) return;
  const actions = e.shiftKey ? { KeyD: deleteNote, KeyL: toggleTheme, KeyS: shorthandForSelection } : {
    KeyD: defineTerm,
    KeyS: addShorthand,
    KeyL: () => $('panel').classList.toggle('open'),
    KeyN: newNote,
    KeyP: pushNote,
    KeyG: connectGithub,
  };
  if (actions[e.code]) { e.preventDefault(); actions[e.code](); }
});

// ms = 0 keeps the message up until the next one
let statusTimer;
function status(msg, kind = '', ms = kind === 'err' ? 6000 : 3000) {
  const s = $('status');
  s.textContent = `✻ ${msg}`;
  s.className = kind;
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(() => { s.textContent = '✻ Ready'; s.className = ''; }, ms);
}

render();
renderAccount();
applySettings();
status('Ready', '', 0);
// Older versions saved a pasted token without the username
if (github.token && !github.login) finishConnect(github.token);
editor.focus();
</script>
</body>
</html>
